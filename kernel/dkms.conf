PACKAGE_NAME="geforce-sriov"
# Keep equal to GS_VERSION in include/gs_devices.h.
PACKAGE_VERSION="0.2.2"
BUILT_MODULE_NAME[0]="geforce_sriov"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Build for each kernel; never link one kernel's build into another.
NO_WEAK_MODULES="yes"
BUILD_EXCLUSIVE_ARCH="x86_64"
BUILD_EXCLUSIVE_CONFIG="CONFIG_LIVEPATCH CONFIG_PCI_IOV"
MAKE[0]="make KDIR=${kernel_source_dir}"
