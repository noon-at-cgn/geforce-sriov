// geforce-sriov: after apt has run dpkg, build NVIDIA's module for an installed kernel whose headers
// were installed after its image (the headers package does not run a kernel hook on every distribution).
// The hook returns at once when every kernel that has headers has its build, and it never fails apt.
DPkg::Post-Invoke { "if [ -x /etc/kernel/postinst.d/geforce-sriov ]; then /etc/kernel/postinst.d/geforce-sriov --retry >&2 || true; fi"; };
